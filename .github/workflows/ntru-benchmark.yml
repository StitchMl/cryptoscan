name: NTRU folding integration benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/test_ntru_origami_full.py"
      - ".github/workflows/ntru-benchmark.yml"

jobs:
  full-origami-bkz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native BKZ backend and CryptoScan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fplll-tools
          python -m pip install -e . pytest python-flint
      - name: Recover private key and decrypt original public ciphertext
        run: |
          timeout 900 python -m pytest -s -q benchmarks/test_ntru_origami_full.py
