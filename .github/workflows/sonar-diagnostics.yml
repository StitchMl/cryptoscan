name: SonarQube diagnostics (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sonar-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gather-public-sonar-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch SonarQube Cloud project diagnostics without modifying anything
        env:
          SONAR_PROJECT: StitchMl_cryptoscan
          SONAR_TASK: AaH0QLSUwiRIpjP40-hU
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          project = os.environ["SONAR_PROJECT"]
          task = os.environ["SONAR_TASK"]
          base = "https://sonarcloud.io"
          directory = Path("sonar-diagnostics")
          directory.mkdir(exist_ok=True)
          endpoints = {
              "quality_gate": ("/api/qualitygates/project_status", {"projectKey": project}),
              "quality_gate_definition": ("/api/qualitygates/show", {"name": "Sonar way"}),
              "measures": ("/api/measures/component", {
                  "component": project, "metricKeys": "coverage,new_coverage,bugs,vulnerabilities,code_smells,security_rating,reliability_rating,sqale_rating,alert_status,duplicated_lines_density"}),
              "background_task": ("/api/ce/task", {"id": task}),
              "analysis_history": ("/api/project_analyses/search", {"project": project, "ps": 10}),
          }

          def get(label, path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "CryptoScan-Sonar-Diagnostics/1.0",
                      "Accept": "application/json",
                  })
                  with urllib.request.urlopen(request, timeout=25) as response:
                      result = json.load(response)
                  (directory / (label + ".json")).write_text(json.dumps(result, indent=2))
                  return result
              except (urllib.error.HTTPError, urllib.error.URLError,
                      ValueError, TimeoutError) as error:
                  print(f"API ERROR {label}: {type(error).__name__}: {error}", flush=True)
                  return None

          for label, (path, params) in endpoints.items():
              result = get(label, path, params)
              if result is not None:
                  print(f"===== {label} =====", flush=True)
                  print(json.dumps(result, ensure_ascii=False)[:20000], flush=True)

          issues = []
          for page in range(1, 21):
              result = get(f"issues_page_{page}", "/api/issues/search", {
                  "componentKeys": project, "issueStatuses": "OPEN,CONFIRMED",
                  "ps": 100, "p": page,
              })
              if not isinstance(result, dict) or "issues" not in result:
                  break
              issues.extend(result["issues"])
              if len(issues) >= result.get("paging", {}).get("total", 0):
                  break
          print(f"===== ISSUES total={len(issues)} =====", flush=True)
          for issue in issues:
              output = {field: issue.get(field) for field in (
                  "key", "rule", "severity", "impactSeverities", "type",
                  "component", "message", "line", "status", "cleanCodeAttribute",
                  "impacts", "textRange", "effort"
              )}
              print(json.dumps(output, ensure_ascii=False), flush=True)
          (directory / "issues_all.json").write_text(
              json.dumps(issues, indent=2, ensure_ascii=False)
          )
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-public-diagnostics
          path: sonar-diagnostics/
          if-no-files-found: warn
