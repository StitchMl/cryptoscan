name: SonarQube diagnostics (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sonar-diagnostics.yml"
      - "src/cryptoscan/or_sigma.py"
      - "src/cryptoscan/bounded_ot.py"
      - "src/cryptoscan/cli.py"
      - "src/cryptoscan/spn_linear_oracle.py"
      - "tests/test_spn_linear_oracle.py"
      - "src/cryptoscan/unramified_ring_oracle.py"
      - "src/cryptoscan/sage_ring_iso_worker.py"
      - "tests/test_unramified_ring_oracle.py"
      - "src/cryptoscan/threshold_rsa.py"
      - "tests/test_threshold_rsa.py"
      - "src/cryptoscan/pairing_confirmation.py"
      - "src/cryptoscan/sage_pairing_confirmation_worker.py"
      - "tests/test_pairing_confirmation.py"
      - "src/cryptoscan/groth16_ticket.py"
      - "tests/test_groth16_ticket.py"
      - "src/cryptoscan/source_units.py"
      - "src/cryptoscan/crypto_hypotheses.py"
      - "src/cryptoscan/rsa_related_key.py"
      - "tests/test_rsa_related_key.py"
      - "tests/test_source_units.py"
      - "src/cryptoscan/masked_ec_signature.py"
      - "tests/test_masked_ec_signature.py"
      - "src/cryptoscan/reducible_ring_signature.py"
      - "src/cryptoscan/sage_reducible_ring_worker.py"
      - "tests/test_reducible_ring_signature.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gather-public-sonar-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch SonarQube Cloud project diagnostics without modifying anything
        env:
          SONAR_PROJECT: StitchMl_cryptoscan
          SONAR_TASK: AaH0QLSUwiRIpjP40-hU
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          project = os.environ["SONAR_PROJECT"]
          task = os.environ["SONAR_TASK"]
          base = "https://sonarcloud.io"
          directory = Path("sonar-diagnostics")
          directory.mkdir(exist_ok=True)
          endpoints = {
              "quality_gate": ("/api/qualitygates/project_status", {"projectKey": project}),
              "quality_gate_definition": ("/api/qualitygates/show", {"name": "Sonar way"}),
              "measures": ("/api/measures/component", {
                  "component": project, "metricKeys": "coverage,new_coverage,bugs,vulnerabilities,code_smells,security_rating,reliability_rating,sqale_rating,alert_status,duplicated_lines_density"}),
              "background_task": ("/api/ce/task", {"id": task}),
              "analysis_history": ("/api/project_analyses/search", {"project": project, "ps": 10}),
          }

          def get(label, path, params):
              url = base + path + "?" + urllib.parse.urlencode(params)
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "CryptoScan-Sonar-Diagnostics/1.0",
                      "Accept": "application/json",
                  })
                  with urllib.request.urlopen(request, timeout=25) as response:
                      result = json.load(response)
                  (directory / (label + ".json")).write_text(json.dumps(result, indent=2))
                  return result
              except (urllib.error.HTTPError, urllib.error.URLError,
                      ValueError, TimeoutError) as error:
                  print(f"API ERROR {label}: {type(error).__name__}: {error}", flush=True)
                  return None

          for label, (path, params) in endpoints.items():
              result = get(label, path, params)
              if result is not None:
                  print(f"===== {label} =====", flush=True)
                  print(json.dumps(result, ensure_ascii=False)[:20000], flush=True)

          issues = []
          for page in range(1, 21):
              result = get(f"issues_page_{page}", "/api/issues/search", {
                  "componentKeys": project, "issueStatuses": "OPEN,CONFIRMED",
                  "ps": 100, "p": page,
              })
              if not isinstance(result, dict) or "issues" not in result:
                  break
              issues.extend(result["issues"])
              if len(issues) >= result.get("paging", {}).get("total", 0):
                  break
          print(f"===== ISSUES total={len(issues)} =====", flush=True)
          for issue in issues:
              output = {field: issue.get(field) for field in (
                  "key", "rule", "severity", "impactSeverities", "type",
                  "component", "message", "line", "status", "cleanCodeAttribute",
                  "impacts", "textRange", "effort"
              )}
              print(json.dumps(output, ensure_ascii=False), flush=True)
          (directory / "issues_all.json").write_text(
              json.dumps(issues, indent=2, ensure_ascii=False)
          )
          PY
      - name: Find exact source duplication blocks behind the Quality Gate
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://sonarcloud.io/api/"
          def request(path, parameters):
              address = base + path + "?" + urllib.parse.urlencode(parameters)
              with urllib.request.urlopen(
                  urllib.request.Request(address, headers={"User-Agent": "cryptoscan-sonar-audit/1.0"}),
                  timeout=25,
              ) as response:
                  return json.load(response)

          project = "StitchMl_cryptoscan"
          try:
              response = request("measures/component_tree", {
                  "component": project, "metricKeys": "new_duplicated_lines,new_duplicated_lines_density,duplicated_lines",
                  "qualifiers": "FIL", "ps": 500,
              })
              files = []
              print("SAMPLE COMPONENT METRICS", json.dumps(response.get("components", [])[:10])[:5000], flush=True)
              for item in response.get("components", []):
                  metric = {m["metric"]: (m.get("value") or next(iter(m.get("periods", [])), {}).get("value", "0")) for m in item.get("measures", [])}
                  count = float(metric.get("new_duplicated_lines", 0) or metric.get("duplicated_lines", 0))
                  if count:
                      files.append((count, item["key"], metric))
              files.sort(reverse=True)
              print("===== SONAR DUPLICATED SOURCE FILES =====", len(files), flush=True)
              for count, key, metrics in files[:35]:
                  print(json.dumps({"file": key, "new_lines": count,
                                    "metrics": metrics}), flush=True)
              extra = [project + ":src/cryptoscan/scanner.py", project + ":src/cryptoscan/gcm_hidden_state.py", project + ":src/cryptoscan/fiat_shamir_batch.py"]
              for key in list(dict.fromkeys([item[1] for item in files[:12]] + extra)):
                  try:
                      duplicates = request("duplications/show", {"key": key})
                      for group in duplicates.get("duplications", [])[:30]:
                          print(json.dumps({"file": key, "blocks": group.get("blocks", [])}),
                                flush=True)
                  except Exception as error:
                      print("DUPLICATIONS ERROR", key, str(error), flush=True)
          except Exception as error:
              print("METRIC ERROR", type(error).__name__, str(error), flush=True)
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-public-diagnostics
          path: sonar-diagnostics/
          if-no-files-found: warn
