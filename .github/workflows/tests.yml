name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest pytest-cov pycryptodome python-flint complexipy
      - run: python -c "from flint import fmpz_mat; print(fmpz_mat([[11,17],[13,19]]).lll())"
      - name: Pytest and XML coverage report
        run: python -m pytest -q --cov=cryptoscan --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Retain the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
