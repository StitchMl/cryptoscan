# SonarQube Cloud Automatic Analysis configuration.
# Production code and test code are disjoint. Challenge sources copied under
# tests/fixtures are test data, not cryptoscan production code.
sonar.sources=src/cryptoscan
sonar.tests=tests
sonar.exclusions=**/__main__.py
sonar.cpd.exclusions=tests/fixtures/**
sonar.python.version=3.10,3.11,3.12
sonar.sourceEncoding=UTF-8
