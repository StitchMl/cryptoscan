[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoscan-ctf"
version = "0.13.1"
description = "Deterministic offline cryptography weakness scanner for CTF Jeopardy challenges"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "cryptoscan contributors"}]
dependencies = ["sympy==1.14.0", "numpy==2.2.6", "mpmath==1.3.0", "python-flint==0.9.0; platform_system == 'Windows'", "bcrypt>=4.0,<6", "pycryptodome>=3.20,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "complexipy"]

[project.scripts]
cryptoscan = "cryptoscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = []

[tool.ruff.lint]
select = ["F", "I", "B", "C4", "PIE", "SIM", "RUF"]
